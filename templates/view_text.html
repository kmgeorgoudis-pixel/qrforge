<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRForge | Προβολή Μηνύματος</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        :root {
            --primary: #6366f1;
            --accent: #38bdf8;
            --bg-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
        }

        body {
            
            background: #4f46e5; 
            background: var(--bg-gradient);
            color: #1e293b;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .content-card {
            background: rgba(255, 255, 255, 0.95); 
            padding: 50px 40px;
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            max-width: 550px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.3);
            text-align: center;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        
        .content-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: var(--bg-gradient);
        }

        .icon-box {
            font-size: 3rem;
            margin-bottom: 20px;
            display: inline-block;
            background: #f1f5f9;
            width: 80px;
            height: 80px;
            line-height: 80px;
            border-radius: 50%;
            color: var(--primary);
        }

        .text-body {
            line-height: 1.8;
            font-size: 1.2rem;
            color: #334155;
            margin: 20px 0;
            word-wrap: break-word;
            white-space: pre-wrap; 
        }

        .text-body b, .text-body strong { 
            color: var(--primary); 
        }

        .btn-back {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 24px;
            background: var(--bg-gradient);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: transform 0.2s;
        }

        .btn-back:hover {
            transform: scale(1.05);
        }

        .footer-logo {
            margin-top: 40px;
            font-size: 0.75rem;
            color: #94a3b8;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .footer-logo span {
            font-weight: bold;
            color: var(--primary);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="content-card">
        <div class="icon-box">✉️</div>
        
        <div class="text-body">
            {{ content | safe }}
        </div>
        
        <a href="/" class="btn-back">Δημιουργήστε το δικό σας QR</a>
        
        <div class="footer-logo">
            QR<span>FORGE</span> PREMIUM
        </div>
    </div>

</body>
</html>
